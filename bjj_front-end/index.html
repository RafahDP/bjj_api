<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJJ Tournament Manager</title>
    <!-- Importação do Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold tracking-wide">🥋 Gestão de Torneio BJJ</h1>
            <span class="text-xs bg-emerald-950 text-emerald-400 px-3 py-1 rounded-full border border-emerald-800">API Conectada</span>
        </header>

        <!-- Formulário para Cadastrar Equipa -->
        <section class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4">
            <h2 class="text-lg font-semibold text-blue-400">Registar Nova Equipa</h2>
            <div class="flex gap-4">
                <input type="text" id="teamName" placeholder="Nome da Equipa (ex: Gracie Barra)" 
                    class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                <button onclick="createTeam()" class="bg-blue-600 hover:bg-blue-500 font-medium px-6 py-2 rounded-lg transition">
                    Salvar Equipa
                </button>
            </div>
        </section>

        <!-- Lista de Equipas Existentes -->
        <section class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4">
            <h2 class="text-lg font-semibold text-blue-400">Equipas Cadastradas</h2>
            <ul id="teamList" class="divide-y divide-slate-800">
                <li class="py-2 text-slate-500">A carregar equipas...</li>
            </ul>
        </section>
    </div>

    <!-- Importação do nosso ficheiro JavaScript -->
    <script src="script.js"></script>
</body>
</html>
